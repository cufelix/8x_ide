<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="{{CSP}}" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meanwhile</title>
    <link rel="stylesheet" href="{{VIBE_CSS}}" />
    <style>
      /* Shared colors and typography are defined in panel.css below. */
      :root {
        --pad: clamp(16px, 4vw, 28px);
        --col: min(100%, 380px);
      }

      * { box-sizing: border-box; }
      [hidden] { display: none !important; }

      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font);
        font-size: 13px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }

      .stage {
        position: relative;
        height: calc(100% - 52px);
        width: 100%;
        container-type: inline-size;
        background: radial-gradient(ellipse 70% 55% at 50% 40%, color-mix(in srgb, var(--fg) 4%, transparent) 0%, transparent 65%), var(--bg);
      }

      .top {
        position: absolute;
        inset: 0 0 auto 0;
        padding: 14px var(--pad) 0;
        z-index: 3;
        display: none;
      }
      .top.is-on { display: block; }

      .header, .activity {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        letter-spacing: 0.02em;
      }
      .header { color: var(--muted); font-size: 11px; }
      .phase-stopped .header { color: var(--fg); font-weight: 500; font-size: 12px; }
      .activity { color: var(--faint); font-size: 11px; margin-top: 2px; min-height: 16px; }

      .hair { margin-top: 8px; height: 1px; background: var(--line); overflow: hidden; }
      .hair > i { display: block; height: 100%; width: 0; background: var(--muted); transition: width 0.8s linear; }

      .focus {
        position: absolute;
        inset: 64px var(--pad) 44px;
        display: grid;
        place-items: center;
        overflow: auto;
      }
      .column { width: var(--col); display: flex; flex-direction: column; gap: 22px; }
      .block { display: none; animation: in 320ms ease-out both; }
      .block.is-on { display: block; }
      @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

      /* Video */
      .frame {
        width: 100%;
        aspect-ratio: 16 / 9;
        border-radius: 4px;
        overflow: hidden;
        background: color-mix(in srgb, var(--fg) 4%, transparent);
        position: relative;
      }
      .frame iframe { width: 100%; height: 100%; border: 0; display: block; }
      .thumb { all: unset; cursor: pointer; display: block; width: 100%; height: 100%; position: relative; }
      .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .thumb span {
        position: absolute; inset: 0; margin: auto; width: 48px; height: 48px; border-radius: 999px;
        display: grid; place-items: center; padding-left: 3px;
        background: rgba(0, 0, 0, 0.55); color: #fff; font-size: 16px;
      }
      .thumb:focus-visible { outline: 1px solid var(--accent); }
      .caption { margin-top: 8px; display: flex; gap: 8px; justify-content: space-between; font-size: 12px; }
      .caption .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .len { color: var(--muted); flex: 0 0 auto; font-variant-numeric: tabular-nums; }
      .upnext { margin-top: 2px; display: flex; gap: 8px; justify-content: space-between; color: var(--muted); font-size: 11px; }
      .upnext .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

      /* One card */
      .kicker { color: var(--faint); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 8px; }
      .card h2 { margin: 0 0 6px; font-size: 15px; font-weight: 500; letter-spacing: -0.01em; line-height: 1.3; }
      .card p { margin: 0 0 12px; color: var(--muted); }
      .choices { display: flex; flex-direction: column; gap: 2px; outline: none; }
      .choice {
        appearance: none; display: flex; gap: 10px; align-items: baseline; width: 100%; text-align: left;
        padding: 8px 8px; border: 0; border-radius: 3px; background: transparent; color: var(--fg);
        font: inherit; cursor: pointer;
      }
      .choice kbd { font: inherit; font-size: 11px; color: var(--faint); min-width: 10px; }
      .choice:hover { background: var(--hover); }
      .choice.is-hi { box-shadow: inset 0 0 0 1px var(--accent); }
      .choice.is-picked { background: var(--pick-bg); color: var(--pick-fg); }
      .choice.is-picked kbd { color: inherit; }
      .card.is-closing .choice:not(.is-picked) { opacity: 0.35; }
      .hint { margin-top: 8px; color: var(--faint); font-size: 11px; }
      .set { display: flex; gap: 8px; align-items: baseline; color: var(--muted); font-size: 12px; }
      .set b { color: var(--fg); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

      /* Agent stopped */
      .summary { font-size: 14px; }
      .summary + button { margin-top: 10px; }
      .ghost { appearance: none; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 12px; cursor: pointer; padding: 2px 0; }
      .ghost:hover { color: var(--fg); }

      .mark {
        position: absolute; left: var(--pad); bottom: 14px;
        font-size: 11px; color: var(--faint); opacity: 0.7; pointer-events: none;
        transition: opacity 240ms ease;
      }

      /* Running pulse before the header line */
      .phase-running .header::before {
        content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 8px;
        border-radius: 50%; background: var(--accent); vertical-align: 1px;
        animation: pulse 2.4s ease-in-out infinite;
      }
      @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }

      .frame { border-radius: 10px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35); transition: border-radius 240ms ease; }
      .column, .focus, .top { transition: opacity 240ms ease, inset 240ms ease; }

      /* Narrow: you are working with the agent. Keep only what matters. */
      @container (max-width: 380px) {
        :root { --pad: 14px; }
        .upnext, .hint, .card p, .activity { display: none; }
        .focus { inset: 44px var(--pad) 36px; }
        .column { gap: 14px; }
        .card h2 { font-size: 13px; }
        .choice { padding: 6px; font-size: 12px; }
        .caption { font-size: 11px; }
      }

      /* Theater: the video takes the whole window. */
      .theater .top, .theater .caption, .theater .upnext, .theater .card, .theater #stopped, .theater .mark { opacity: 0; pointer-events: none; }
      .theater .card, .theater #stopped { display: none; }
      .theater .focus { inset: 0; }
      .theater .column { width: 100%; height: 100%; justify-content: center; align-items: center; }
      .theater #videoBlock { width: min(100%, calc(100vh * 16 / 9)); }
      .theater .frame { border-radius: 0; box-shadow: none; }
      .exit {
        position: absolute; top: 12px; right: 12px; z-index: 5; display: none;
        appearance: none; border: 0; border-radius: 999px; padding: 6px 12px;
        background: rgba(0, 0, 0, 0.55); color: #fff; font: inherit; font-size: 11px; cursor: pointer;
        opacity: 0; transition: opacity 200ms ease;
      }
      .theater .exit { display: block; }
      .theater:hover .exit, .exit:focus-visible { opacity: 1; }

      .mode-bar {
        height: 52px; padding: 0 18px; display: flex; align-items: center;
        justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line);
        background: var(--bg); position: relative; z-index: 6;
      }
      .mode-brand { font-size: 12px; font-weight: 600; letter-spacing: -0.03em; color: var(--muted); }
      .mode-switch { display: flex; gap: 3px; padding: 3px; border: 1px solid var(--line); border-radius: 9px; }
      .mode-switch button { appearance: none; background: transparent; border: 0; border-radius: 6px; color: var(--muted); font: inherit; font-size: 12px; padding: 5px 13px; cursor: pointer; }
      .mode-switch button[aria-pressed="true"] { background: var(--hover); color: var(--fg); }
      .mode-switch button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .mode-switch button:disabled { cursor: wait; }
      #vibeRoot { position: absolute; inset: 52px 0 0; overflow: auto; }
      .vibe-save-status { position: fixed; bottom: 12px; left: 12px; right: 12px; z-index: 8; padding: 12px; background: var(--bg); color: var(--fg); border: 1px solid var(--accent); border-radius: 8px; font-size: 12px; }
      .vibe-save-status button { color: var(--fg); background: var(--hover); border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; margin-left: 8px; font: inherit; cursor: pointer; }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; transition: none !important; }
      }
    </style>
    <link rel="stylesheet" href="{{PANEL_CSS}}" />
  </head>
  <body>
    <nav class="mode-bar" aria-label="Meanwhile modes">
      <span class="mode-brand" aria-label="Meanwhile"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h5v10H4zM15 7h5v10h-5z" fill="currentColor"/></svg><span class="mode-brand-name">meanwhile</span></span>
      <div class="mode-actions">
        <div class="mode-switch" role="group" aria-label="Choose a mode">
          <button type="button" data-mode="work" aria-pressed="true" disabled>Work</button>
          <button type="button" data-mode="vibe" aria-pressed="false" disabled>Vibe</button>
        </div>
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="Switch theme" disabled>
          <svg class="theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
          <svg class="theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.7 13.1A8.8 8.8 0 0 1 10.9 3.3 8.8 8.8 0 1 0 20.7 13.1Z"/></svg>
        </button>
      </div>
    </nav>
    <div class="stage" id="stage">
      <div class="top" id="top">
        <div class="header" id="header"></div>
        <div class="activity" id="activity"></div>
        <div class="hair"><i id="bar"></i></div>
      </div>

      <div class="focus">
        <div class="column">
          <div class="block" id="videoBlock">
            <div class="frame" id="frame"></div>
            <div class="caption"><span class="title" id="vTitle"></span><span class="len" id="vLen"></span></div>
            <div class="upnext" id="upNext"></div>
          </div>
          <div class="block card" id="card"></div>
          <div class="block" id="stopped">
            <div class="summary" id="summary"></div>
            <button class="ghost" type="button" id="openDiff">Open the diff</button>
          </div>
        </div>
      </div>

      <div class="mark">Meanwhile</div>
      <button class="exit" type="button" id="exitTheater">Esc · back</button>
    </div>

    <section id="vibeRoot" aria-label="Vibe web activities" hidden></section>
    <div id="vibeSaveStatus" class="vibe-save-status" role="status" hidden>
      <span id="vibeSaveText"></span><button id="vibeSaveRetry" type="button">Retry save</button>
    </div>

    <script src="{{VIEW_MODEL}}"></script>
    <script src="{{VIBE_MODEL}}"></script>
    <script src="{{VIBE_UI}}"></script>
    <script src="{{PANEL_THEME}}"></script>
    <script src="{{VIBE_BRIDGE}}"></script>
    <script>
      const vscode = acquireVsCodeApi();
      const $ = (id) => document.getElementById(id);
      const el = {
        stage: $("stage"), top: $("top"), header: $("header"), activity: $("activity"), bar: $("bar"),
        videoBlock: $("videoBlock"), frame: $("frame"), vTitle: $("vTitle"), vLen: $("vLen"), upNext: $("upNext"),
        card: $("card"), stopped: $("stopped"), summary: $("summary"),
      };
      const voice = new Audio();

      /** Last state from the extension, re-rendered on a clock tick. */
      let last = null;
      let playerBase = null;
      let lastVoice = null;
      let theater = false;
      // Watch state: the player tells us what the user is doing.
      const watch = { pinnedVideoId: null, minClip: 0, engaged: false, sessionId: null };
      let loadedVideoId = null;
      let iframe = null;
      let playerReady = false;
      let pendingLoad = null;
      let brokenIds = new Set();
      // Question state
      let questionKey = null;
      let hi = -1;
      let picking = null;
      let activeMode = "work";
      const modes = MeanwhileModes.mount({
        vscode,
        onModeChange(mode) {
          activeMode = mode;
          if (mode === "vibe") {
            stopVideo();
            voice.pause();
            if (theater) vscode.postMessage({ type: "exitTheater" });
          } else {
            render();
          }
        },
      });

      function on(node, yes) { node.classList.toggle("is-on", !!yes); }
      function esc(s) {
        return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }
      function toPlayer(msg) {
        // Commands sent before the player page is up would be dropped; keep the latest load.
        if (!playerReady) {
          if (msg.cmd === "load") pendingLoad = msg;
          return;
        }
        iframe?.contentWindow?.postMessage({ target: "meanwhile-player", ...msg }, "*");
      }

      function stopVideo() {
        if (iframe) toPlayer({ cmd: "stop" });
        el.frame.innerHTML = "";
        iframe = null;
        playerReady = false;
        pendingLoad = null;
        loadedVideoId = null;
      }

      function thumb(video) {
        const src = `https://i.ytimg.com/vi/${encodeURIComponent(video.videoId)}/hqdefault.jpg`;
        el.frame.innerHTML = `<button class="thumb" type="button" title="Open on YouTube"><img src="${src}" alt="" /><span>▶</span></button>`;
        el.frame.querySelector("button").addEventListener("click", () => vscode.postMessage({ type: "openUrl", url: video.url }));
        iframe = null;
      }

      function renderVideo(video, upNext) {
        on(el.videoBlock, !!video);
        if (!video) { stopVideo(); return; }
        el.vTitle.textContent = video.title || "";
        el.vLen.textContent = video.lengthLabel || "";
        el.upNext.innerHTML = upNext
          ? `<span class="title">Up next · ${esc(upNext.title)}</span><span class="len">${esc(upNext.lengthLabel || "")}</span>`
          : "";
        if (video.videoId === loadedVideoId) return;
        loadedVideoId = video.videoId;
        if (!playerBase || brokenIds.has(video.videoId)) { thumb(video); return; }
        if (iframe) {
          toPlayer({ cmd: "load", videoId: video.videoId, autoplay: watch.engaged });
          return;
        }
        el.frame.innerHTML = "";
        playerReady = false;
        pendingLoad = null;
        iframe = document.createElement("iframe");
        iframe.src = `${playerBase}/player?v=${encodeURIComponent(video.videoId)}`;
        iframe.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
        iframe.referrerPolicy = "strict-origin-when-cross-origin";
        iframe.title = video.title || "Video";
        el.frame.appendChild(iframe);
      }

      function renderQuestion(q) {
        if (!q) { on(el.card, false); questionKey = null; return; }
        on(el.card, true);
        if (q.state === "set") {
          const key = `set:${q.line}`;
          if (questionKey === key || picking) return;
          questionKey = key;
          el.card.classList.remove("is-closing");
          el.card.innerHTML = `<div class="set"><span>Constraint</span><b title="${esc(q.line)}">${esc(q.line)}</b></div>`;
          return;
        }
        const key = `open:${q.title}`;
        if (questionKey === key) return;
        questionKey = key;
        hi = -1;
        el.card.classList.remove("is-closing");
        el.card.innerHTML = `
          <div class="kicker">${esc(q.kicker)}</div>
          <h2>${esc(q.title)}</h2>
          ${q.body ? `<p>${esc(q.body)}</p>` : ""}
          <div class="choices" tabindex="-1">
            ${q.choices.map((c, i) => `<button class="choice" type="button" data-id="${esc(c.id)}"><kbd>${i + 1}</kbd><span>${esc(c.label)}</span></button>`).join("")}
          </div>
          <div class="hint">1–3 to answer · Ctrl+Alt+M then Enter</div>`;
        el.card.querySelectorAll(".choice").forEach((btn) => btn.addEventListener("click", () => pick(btn.dataset.id)));
      }

      function choiceButtons() { return [...el.card.querySelectorAll(".choice")]; }

      function highlight(i) {
        const buttons = choiceButtons();
        if (!buttons.length) return;
        hi = (i + buttons.length) % buttons.length;
        buttons.forEach((b, j) => b.classList.toggle("is-hi", j === hi));
        buttons[hi].focus({ preventScroll: true });
      }

      /** Mark the pick, hold a beat, then collapse to the one-line constraint. */
      function pick(choiceId) {
        if (!choiceId || picking) return;
        picking = choiceId;
        choiceButtons().forEach((b) => b.classList.toggle("is-picked", b.dataset.id === choiceId));
        el.card.classList.add("is-closing");
        vscode.postMessage({ type: "answer", choiceId });
        setTimeout(() => { picking = null; questionKey = null; render(); }, 700);
      }

      function render() {
        if (!last) return;
        const session = last.session;
        modes.setSession(session);
        if (activeMode === "vibe") return;
        if (session?.id !== watch.sessionId) {
          Object.assign(watch, { pinnedVideoId: null, minClip: 0, engaged: false, sessionId: session?.id ?? null });
          brokenIds = new Set();
        }
        const view = MeanwhileView.buildView(session, Date.now() - (last.skew || 0), watch);
        el.stage.className = `stage phase-${view.phase}${theater && view.video ? " theater" : ""}`;
        if (theater && !view.video) vscode.postMessage({ type: "exitTheater" });

        on(el.top, view.phase !== "none");
        el.header.textContent = view.headerText || "";
        el.activity.textContent = view.activityLine || "";
        el.bar.style.width = `${view.progressPct}%`;

        renderVideo(view.phase === "running" ? view.video : null, view.upNext);
        if (view.video) watch.minClip = Math.max(watch.minClip, view.video.index);
        renderQuestion(view.question);

        on(el.stopped, view.phase === "stopped");
        el.summary.textContent = view.summary || "";

        if (last.voiceUri && last.voiceUri !== lastVoice) {
          lastVoice = last.voiceUri;
          voice.src = last.voiceUri;
          voice.play().catch(() => {});
        }
      }

      window.addEventListener("message", (event) => {
        const data = event.data || {};
        if (data.source === "meanwhile-player") {
          if (!iframe || event.source !== iframe.contentWindow) return;
          if (data.type === "state" && [0, 1, 2].includes(data.state)) {
            vscode.postMessage({ type: "player", playing: data.state === 1 });
          }
          if (data.type === "ready") {
            playerReady = true;
            if (pendingLoad) toPlayer(pendingLoad);
            pendingLoad = null;
          } else if (data.type === "state" && (data.state === 1 || data.state === 2)) {
            watch.engaged = data.state === 1 || watch.engaged;
            watch.pinnedVideoId = loadedVideoId;
          } else if (data.type === "state" && data.state === 0) {
            watch.pinnedVideoId = null;
            watch.minClip += 1;
            render();
          } else if (data.type === "error" && loadedVideoId) {
            brokenIds.add(loadedVideoId);
            loadedVideoId = null;
            iframe = null;
            playerReady = false;
            render();
          }
          return;
        }
        // Cursor forwards host messages from its outer, same-origin webview.
        // The localhost/YouTube child frames cannot initialize or save Vibe.
        if (event.origin !== window.location.origin) return;
        modes.receive(data);
        if (data.type === "state") {
          playerBase = data.payload.playerBase || null;
          last = { ...data.payload, skew: Date.now() - data.payload.now };
          render();
        } else if (data.type === "theater") {
          theater = !!data.on;
          render();
        } else if (data.type === "focusQuestion") {
          if (activeMode === "work" && choiceButtons().length && !picking) highlight(0);
        } else if (data.type === "cycleChoice") {
          if (activeMode === "work" && choiceButtons().length && !picking) highlight(hi + 1);
        }
      });

      function leaveTheater() {
        if (!theater) return;
        toPlayer({ cmd: "pause" });
        vscode.postMessage({ type: "exitTheater" });
      }
      $("exitTheater").addEventListener("click", leaveTheater);

      document.addEventListener("keydown", (e) => {
        if (activeMode === "vibe") return;
        if (e.key === "Escape" && theater) {
          e.preventDefault();
          leaveTheater();
          return;
        }
        const buttons = choiceButtons();
        if (!buttons.length || picking || e.ctrlKey || e.metaKey || e.altKey) return;
        if (/^[1-3]$/.test(e.key) && buttons[Number(e.key) - 1]) {
          e.preventDefault();
          pick(buttons[Number(e.key) - 1].dataset.id);
        } else if (e.key === "ArrowDown" || e.key === "ArrowUp") {
          e.preventDefault();
          highlight(hi + (e.key === "ArrowDown" ? 1 : -1));
        } else if (e.key === "Enter" && hi >= 0) {
          e.preventDefault();
          pick(buttons[hi].dataset.id);
        }
      });

      $("openDiff").addEventListener("click", () => vscode.postMessage({ type: "openDiff" }));
      setInterval(render, 1000);
      vscode.postMessage({ type: "ready" });
    </script>
  </body>
</html>
